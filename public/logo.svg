<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- California Sunset Gradient -->
    <linearGradient id="sunsetGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="50%" stop-color="#FF7A45" />
      <stop offset="100%" stop-color="#FFB86B" />
    </linearGradient>

    <!-- Electric Indigo Gradient -->
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#536DFE" />
      <stop offset="50%" stop-color="#3D5AFE" />
      <stop offset="100%" stop-color="#1E2968" />
    </linearGradient>

    <!-- Deep Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151A28" />
      <stop offset="100%" stop-color="#0A0D16" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle / Rounded Modern Container -->
  <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />

  <!-- Ambient Glow Behind Monogram -->
  <circle cx="60" cy="62" r="38" fill="#3D5AFE" opacity="0.22" filter="url(#glow)" />
  <circle cx="78" cy="48" r="24" fill="#FF7A45" opacity="0.28" filter="url(#glow)" />

  <!-- Interlocking WWW Geometric Chevron Monogram -->
  <!-- Left Wing / West Compass Arrow (Electric Indigo) -->
  <path
    d="M 24 38 L 40 76 L 52 48 L 42 48 L 36 60 L 28 38 Z"
    fill="url(#indigoGrad)"
    opacity="0.95"
  />

  <!-- Center Wing Interlock (Deep Indigo to Electric) -->
  <path
    d="M 46 44 L 60 78 L 74 44 L 64 44 L 60 56 L 56 44 Z"
    fill="url(#indigoGrad)"
  />

  <!-- Dynamic West-Ward Forward Chevron Vector (Sunset Coral to Amber) -->
  <path
    d="M 68 40 L 82 74 L 96 38 L 86 38 L 80 54 L 74 40 Z"
    fill="url(#sunsetGrad)"
  />

  <!-- Top Dynamic West Arrow / Horizon Beam Accents -->
  <polygon
    points="60,24 64,30 60,36 56,30"
    fill="url(#sunsetGrad)"
  />

  <!-- Precision Corner Dots -->
  <circle cx="60" cy="88" r="2.5" fill="#3D5AFE" opacity="0.8" />
</svg>
